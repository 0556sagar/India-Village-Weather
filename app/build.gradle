plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 30
def appVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0.30"
android {
    namespace 'com.example.indiavillageweather'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.indiavillageweather"
        minSdk 29
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.constraintlayout:constraintlayout:2.2.0")
    implementation("androidx.cardview:cardview:1.0.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
}
