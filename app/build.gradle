plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getAutoVersionCode() {
    // 1. Agar GitHub Actions se run ho raha hai toh GITHUB_RUN_NUMBER automatically le lega
    def ghRun = System.getenv("GITHUB_RUN_NUMBER")
    if (ghRun != null && ghRun.trim().isInteger()) {
        return 30 + ghRun.trim().toInteger()
    }

    // 2. Agar -PversionCode pass kiya gaya ho
    def propCode = project.findProperty('versionCode')?.toString()?.trim()
    if (propCode && propCode.isInteger()) {
        return propCode.toInteger()
    }

    // 3. Fallback: Git commit count se auto-increment
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def countStr = stdout.toString().trim()
        if (countStr.isInteger()) {
            return 30 + countStr.toInteger()
        }
    } catch (Exception ignored) {}

    return 31
}

def appVersionCode = getAutoVersionCode()
def appVersionName = "1.0.${appVersionCode}"

android {
    namespace 'com.example.indiavillageweather'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.indiavillageweather"
        minSdk 29
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.constraintlayout:constraintlayout:2.2.0")
    implementation("androidx.cardview:cardview:1.0.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
}
