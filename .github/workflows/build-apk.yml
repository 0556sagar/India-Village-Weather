- name: Set Auto Version
        id: version
        run: |
          NEW_CODE=${{ github.run_number }}
          NEW_NAME="1.0.${{ github.run_number }}"
          echo "code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
